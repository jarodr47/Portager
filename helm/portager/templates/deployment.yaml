{{- include "portager.caBundle.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portager.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "portager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $caChecksum := and .Values.caBundle.enabled .Values.caBundle.inline }}
      {{- if or .Values.podAnnotations $caChecksum }}
      annotations:
        {{- if $caChecksum }}
        # Go loads its trust store once at startup, so a changed CA needs a new pod.
        checksum/ca-bundle: {{ .Values.caBundle.inline | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "portager.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "portager.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "portager.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - containerPort: 8443
              name: https
              protocol: TCP
            {{- end }}
            - containerPort: 8081
              name: health
              protocol: TCP
          {{- if .Values.aws.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.aws.existingSecret }}
          {{- end }}
          env:
            - name: TUF_ROOT
              value: /tmp/.sigstore
            {{- if .Values.caBundle.enabled }}
            {{- if eq .Values.caBundle.mode "replace" }}
            # Trust ONLY the supplied CA. SSL_CERT_FILE replaces the default file
            # list and SSL_CERT_DIR the default directory list; setting both is
            # what excludes the system roots entirely.
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.caBundle.mountPath .Values.caBundle.key | quote }}
            - name: SSL_CERT_DIR
              value: {{ .Values.caBundle.mountPath | quote }}
            {{- else }}
            # Go unions the certificates found across every directory in
            # SSL_CERT_DIR, so listing the system path alongside ours appends
            # the private CA to the public roots rather than replacing them.
            - name: SSL_CERT_DIR
              value: {{ printf "/etc/ssl/certs:%s" .Values.caBundle.mountPath | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.aws.credentials.enabled }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.aws.credentials.accessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.aws.credentials.secretAccessKey | quote }}
            - name: AWS_REGION
              value: {{ .Values.aws.credentials.region | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.caBundle.enabled }}
            - name: ca-bundle
              mountPath: {{ .Values.caBundle.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        {{- if .Values.caBundle.enabled }}
        {{- include "portager.caBundle.volume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
