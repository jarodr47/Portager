image:
  repository: ghcr.io/jarodr47/portager
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

leaderElection:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # requires Prometheus Operator CRDs

serviceAccount:
  create: true
  name: ""  # defaults to release fullname
  annotations: {}
  # For EKS IRSA:
  # eks.amazonaws.com/role-arn: arn:aws:iam::role/portager-ecr-role
  # For GKE Workload Identity (method: gar):
  # iam.gke.io/gcp-service-account: portager@my-project.iam.gserviceaccount.com

aws:
  # For non-EKS clusters: inject AWS credentials as env vars
  credentials:
    enabled: false
    accessKeyId: ""
    secretAccessKey: ""
    region: "us-east-1"
  # Reference an existing Secret containing AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
  existingSecret: ""

# -- Scheduling

nodeSelector: {}
  # disktype: ssd

tolerations: []
  # - key: "dedicated"
  #   operator: "Equal"
  #   value: "portager"
  #   effect: "NoSchedule"

affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     - labelSelector:
  #         matchExpressions:
  #           - key: app.kubernetes.io/name
  #             operator: In
  #             values:
  #               - portager
  #       topologyKey: kubernetes.io/hostname

topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: portager

priorityClassName: ""
  # Recommended for production: system-cluster-critical

# -- Pod metadata and pull secrets

podAnnotations: {}

podLabels: {}

imagePullSecrets: []
  # - name: my-registry-secret

# -- Extra container and volume configuration

extraEnv: []
  # - name: MY_VAR
  #   value: my-value

extraVolumes: []
  # - name: tmp
  #   emptyDir: {}

extraVolumeMounts: []
  # - name: tmp
  #   mountPath: /tmp

# -- Custom CA certificates for private registries
#
# Mounts a PEM-encoded CA bundle into the controller and points Go's trust store
# at it, so Portager can talk to registries whose certificates are signed by an
# internal CA. Applies to every outbound connection — registries, AWS STS/ECR,
# Google token endpoints, and the Sigstore TUF/Fulcio/Rekor endpoints used by
# keyless cosign verification.
#
# Note: Go builds its trust store once at startup, so rotating the CA requires a
# pod restart. When `inline` is used the chart adds a checksum annotation that
# rolls the pods automatically.

caBundle:
  enabled: false

  # Exactly one source must be set when enabled.
  # existingSecret / existingConfigMap reference an object you already manage —
  # for example a trust-manager Bundle target, which is a ConfigMap.
  existingSecret: ""
  existingConfigMap: ""
  # inline creates a ConfigMap from a PEM string supplied here.
  inline: ""
  #   inline: |
  #     -----BEGIN CERTIFICATE-----
  #     ...
  #     -----END CERTIFICATE-----

  # Key within the Secret/ConfigMap holding the PEM bundle. The default matches
  # cert-manager Certificate Secrets, trust-manager Bundles, and kube-root-ca.crt.
  key: ca.crt

  mountPath: /etc/portager/ca

  # append  — trust this CA IN ADDITION to the public roots. Safe default; keeps
  #           Docker Hub, GHCR, ECR and friends working.
  # replace — trust ONLY this CA. Public registries and public Sigstore endpoints
  #           will stop working. Intended for fully air-gapped installs.
  mode: append

# -- Disruption and probes

podDisruptionBudget:
  enabled: false
  minAvailable: 1

startupProbe:
  enabled: false

terminationGracePeriodSeconds: 10

# -- Network policies

networkPolicy:
  enabled: false
  metrics:
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
  egress:
    registryCIDRs: []
      # - 10.0.0.0/8
    apiServerCIDR: ""
      # e.g., 10.96.0.1/32
